title: CDR4176 - 2 GHz 4-Quadrant Phase Interpolator with 8x Network
authors:
- Agustina Trabichet
- Victor Muñoz
- Macarena Gonzalez
- Juana Pucheta Valentín Ramirez
- Pablo Dominguez
type: Analog
tapeout_target: true
description: >-
  CDR4176 combines a four-phase clock generator, an 8x phase interpolator,
  a divide-by-eight stage, and an output buffer in the IHP SG13G2 process.
  The v.1.0.0 layout is published at release/v.1.0.0/gds/CDR4176.gds.
status_text: GDS published; revalidation pending
